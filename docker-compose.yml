services:
  product-image-processor:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads
      - ./resource:/app/resource:ro
    environment:
      - USE_MILVUS=true
      - MILVUS_LITE_PATH=/app/data/milvus.db
      - MILVUS_COLLECTION=product_embeddings
      - CLIP_MODEL=${CLIP_MODEL:-ViT-B-32}
      - CLIP_PRETRAINED=${CLIP_PRETRAINED:-openai}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app-data:
  app-uploads:
