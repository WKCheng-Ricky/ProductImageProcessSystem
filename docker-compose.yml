version: '3.8'

services:
  product-image-processor:
    build: .
    ports:
      - "8001:8000"
    volumes:
      # Persist data and uploads
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./resource:/app/resource
    environment:
      # Enable Milvus for persistent vector DB
      - USE_MILVUS=true
      - MILVUS_LITE_PATH=/app/data/milvus.db
      - MILVUS_COLLECTION=product_embeddings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
